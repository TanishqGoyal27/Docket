spring.application.name=docket
server.port=${PORT:8080}
server.servlet.session.timeout=30m
# H2 (open source) saved to a file, so applications and uploaded files survive restarts.
# Delete the data/ folder to start again from the seed data.
spring.datasource.url=jdbc:h2:file:./data/docketdb
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

docket.upload.max-size-mb=10
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB
server.tomcat.max-swallow-size=-1
# Application-fee payment gateway. Leave the keys empty to use Docket's built-in sandbox gateway
# (test mode, no real money). To use Razorpay, create a Razorpay account and put its TEST mode keys
# in the RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET environment variables. Never commit real keys.
docket.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
docket.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# Address the app is reached at; used in the links emailed to teachers
docket.public-url=${DOCKET_PUBLIC_URL:http://localhost:8080}
# Only accept teacher emails on this domain, e.g. thapar.edu (empty = any domain, for testing)
docket.supervisor.allowed-email-domain=${DOCKET_TEACHER_EMAIL_DOMAIN:}

# Email (SMTP). Not set = emails are only saved to the Administrator's Email outbox.
# To send real email set environment variables, for example for Gmail (use an App Password):
#   SPRING_MAIL_HOST=smtp.gmail.com  SPRING_MAIL_PORT=587
#   SPRING_MAIL_USERNAME=you@gmail.com  SPRING_MAIL_PASSWORD=<app password>
#   SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
