<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Docket Admin · Create User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{admin/navbar :: navbar('users')}"></div>

<main class="container pb-5" style="max-width: 720px;">
    <!-- Feedback Alerts -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">Error message</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="mb-4">
        <a th:href="@{/admin/users}" class="text-decoration-none small text-secondary">&larr; Back to Users</a>
        <h1 class="h3 fw-bold mt-2 mb-1">Create New User</h1>
        <p class="text-secondary mb-0">Fill in account details. Passwords will be securely hashed with BCrypt.</p>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <form th:action="@{/admin/users}" method="post">
                <h5 class="fw-bold mb-3">Required Credentials</h5>
                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-6">
                        <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" name="name" required placeholder="e.g. John Doe">
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="user@docket.com">
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-6">
                        <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password" name="password" minlength="8" required placeholder="At least 8 characters">
                        <div class="form-text">Must be at least 8 characters long.</div>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="role" class="form-label">Role <span class="text-danger">*</span></label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="" disabled selected>Select user role...</option>
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r.name()}">ROLE</option>
                        </select>
                    </div>
                </div>

                <hr class="my-4">

                <h5 class="fw-bold mb-3">Profile Details (Optional)</h5>
                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-6">
                        <label for="department" class="form-label">Department</label>
                        <input type="text" class="form-control" id="department" name="department" placeholder="e.g. Computer Science (Staff)">
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phone" name="phone" placeholder="e.g. 9876543210">
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-6">
                        <label for="rollNumber" class="form-label">Roll Number</label>
                        <input type="text" class="form-control" id="rollNumber" name="rollNumber" placeholder="e.g. 102403001 (Students)">
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="course" class="form-label">Course / Program</label>
                        <input type="text" class="form-control" id="course" name="course" placeholder="e.g. BE Computer Engineering">
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Create User</button>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
