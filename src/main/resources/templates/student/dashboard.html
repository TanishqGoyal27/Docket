<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Docket - Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-4 mb-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="mb-0">My Applications</h3>
                <small class="text-muted">Welcome, <span th:text="${studentName}">Student</span></small>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-secondary btn-sm">Log out</button>
            </form>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">

                <div th:if="${#lists.isEmpty(applications)}" class="text-center text-muted py-4">
                    You have not submitted any applications yet.
                </div>

                <div th:unless="${#lists.isEmpty(applications)}" class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Reference</th>
                                <th>Service</th>
                                <th>Status</th>
                                <th>Current stage</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="app : ${applications}">
                                <td th:text="${app.referenceNumber != null ? app.referenceNumber : '-'}">-</td>
                                <td th:text="${app.service.name}">Service</td>
                                <td>
                                    <span class="badge"
                                        th:classappend="${app.status.name() == 'APPROVED' or app.status.name() == 'PROCESSED' or app.status.name() == 'CLOSED'} ? 'bg-success' :
                                                  (${app.status.name() == 'REJECTED'} ? 'bg-danger' :
                                                  (${app.status.name() == 'AWAITING_CORRECTION'} ? 'bg-warning text-dark' : 'bg-primary'))"
                                        th:text="${app.status.name().replace('_', ' ')}">SUBMITTED</span>
                                </td>
                                <td th:text="${app.currentStage != null ? app.currentStage.name : 'Finished'}">Stage
                                </td>
                                <td th:text="${#temporals.format(app.submittedAt, 'dd MMM yyyy')}">01 Jan 2026</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</body>

</html>
