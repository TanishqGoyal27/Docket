<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Docket - ID Card Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-4 mb-5" style="max-width: 720px;">

        <div class="mb-3">
            <a th:href="@{/student/dashboard}" class="text-decoration-none">&larr; Back to dashboard</a>
        </div>

        <h3 class="mb-4">ID Card Application</h3>

        <!-- Error messages -->
        <div th:if="${errors != null and !#lists.isEmpty(errors)}" class="alert alert-danger mb-4">
            <ul class="mb-0 ps-3">
                <li th:each="err : ${errors}" th:text="${err}">Error message</li>
            </ul>
        </div>

        <div id="sizeError" class="alert alert-danger d-none" role="alert"></div>

        <form method="post" enctype="multipart/form-data" th:action="@{/student/apply/id-card}">

            <!-- Student details (read-only) -->
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="card-title mb-3">Your details</h5>
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" id="name" class="form-control" th:value="${student.name}" readonly>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" th:value="${student.email}" readonly>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="rollNumber" class="form-label">Roll number</label>
                            <input type="text" id="rollNumber" class="form-control" th:value="${student.rollNumber}" readonly>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="course" class="form-label">Course</label>
                            <input type="text" id="course" class="form-control" th:value="${student.course}" readonly>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Required documents upload -->
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="card-title mb-3">Required documents</h5>
                    <div class="mb-3" th:each="doc : ${documents}">
                        <label th:for="|doc_${doc.id}|" class="form-label d-flex justify-content-between align-items-center">
                            <span th:text="${doc.documentName}">Document Name</span>
                            <span th:if="${doc.mandatory}" class="badge bg-danger">Required</span>
                            <span th:unless="${doc.mandatory}" class="badge bg-secondary">Optional</span>
                        </label>
                        <input type="file" class="form-control" th:id="|doc_${doc.id}|" th:name="|doc_${doc.id}|">
                    </div>
                    <small class="text-muted d-block">Accepted files: PDF, JPEG, PNG. Maximum 10 MB each.</small>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">Submit Application</button>
            </div>

        </form>

    </div>

    <script>
        // Maximum allowed file size in megabytes (10 MB in Docket)
        const MAX_MB = 10;
        const maxSizeBytes = MAX_MB * 1024 * 1024;
        const form = document.querySelector('form');
        const sizeError = document.getElementById('sizeError');
        const fileInputs = document.querySelectorAll('input[type="file"]');

        form.addEventListener('submit', function (event) {
            for (const input of fileInputs) {
                if (input.files && input.files.length > 0) {
                    const file = input.files[0];
                    if (file.size > maxSizeBytes) {
                        event.preventDefault();
                        sizeError.textContent = file.name + ' is larger than ' + MAX_MB + ' MB. Please choose a smaller file.';
                        sizeError.classList.remove('d-none');
                        sizeError.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        return;
                    }
                }
            }
            sizeError.classList.add('d-none');
        });

        // Hide the error alert as soon as the user selects a new file
        fileInputs.forEach(function (input) {
            input.addEventListener('change', function () {
                sizeError.classList.add('d-none');
            });
        });
    </script>
</body>

</html>
