<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Docket - ID Card Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-4 mb-5" style="max-width: 720px;">

        <div class="mb-3">
            <a th:href="@{/student/dashboard}" class="text-decoration-none">&larr; Back to dashboard</a>
        </div>

        <h3 class="mb-4">ID Card Application</h3>

        <!-- Student details (read-only) -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Your details</h5>
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" id="name" class="form-control" th:value="${student.name}" readonly>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" th:value="${student.email}" readonly>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="rollNumber" class="form-label">Roll number</label>
                        <input type="text" id="rollNumber" class="form-control" th:value="${student.rollNumber}" readonly>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="course" class="form-label">Course</label>
                        <input type="text" id="course" class="form-control" th:value="${student.course}" readonly>
                    </div>
                </div>
            </div>
        </div>

        <!-- Required documents checklist -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-3">Required documents</h5>
                <ul class="list-group mb-3">
                    <li th:each="doc : ${documents}" class="list-group-item d-flex justify-content-between align-items-center">
                        <span th:text="${doc.documentName}">Document Name</span>
                        <span class="badge"
                              th:classappend="${doc.mandatory} ? 'bg-danger' : 'bg-secondary'"
                              th:text="${doc.mandatory} ? 'Required' : 'Optional'">Required</span>
                    </li>
                </ul>
                <small class="text-muted d-block">Accepted files: PDF, JPEG, PNG. Maximum 10 MB each.</small>
            </div>
        </div>

    </div>
</body>

</html>
