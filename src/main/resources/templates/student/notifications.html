<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Docket - Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-4 mb-5" style="max-width: 720px;">

        <div class="mb-3">
            <a th:href="@{/student/dashboard}" class="text-decoration-none">&larr; Back to dashboard</a>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h3 class="mb-0">Notifications</h3>
                <small class="text-muted">
                    <span th:if="${unreadCount != null and unreadCount > 0}" th:text="${unreadCount + ' unread message(s)'}">1 unread</span>
                    <span th:unless="${unreadCount != null and unreadCount > 0}">All caught up</span>
                </small>
            </div>
            <div th:if="${!#lists.isEmpty(notifications)}">
                <form th:action="@{/student/notifications/read-all}" method="post">
                    <button type="submit" class="btn btn-outline-secondary btn-sm" th:disabled="${unreadCount == 0}">Mark all as read</button>
                </form>
            </div>
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(notifications)}" class="card shadow-sm">
            <div class="card-body text-center text-muted py-5">
                <p class="mb-0">You have no notifications yet.</p>
            </div>
        </div>

        <!-- Notification items -->
        <div th:unless="${#lists.isEmpty(notifications)}" class="list-group shadow-sm">
            <div th:each="notif : ${notifications}"
                 class="list-group-item p-3"
                 th:classappend="${!notif.read} ? 'border-start border-primary border-4 bg-white' : 'bg-light'">
                <div class="d-flex w-100 justify-content-between align-items-start gap-2">
                    <div class="me-auto">
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <span th:if="${!notif.read}" class="badge bg-primary">New</span>
                            <span th:if="${notif.read}" class="badge bg-secondary">Read</span>
                            <small class="text-muted" th:text="${#temporals.format(notif.createdAt, 'dd MMM yyyy, HH:mm')}">01 Jan 2026, 12:00</small>
                        </div>
                        <p class="mb-1" th:classappend="${!notif.read} ? 'fw-semibold text-dark' : 'text-body'" th:text="${notif.message}">Notification message text</p>
                        <div th:if="${notif.application != null}" class="mt-1">
                            <a th:href="@{'/student/applications/' + ${notif.application.id}}"
                               class="badge bg-light text-primary border text-decoration-none">
                                View Application
                                <span th:if="${notif.application.referenceNumber != null}" th:text="'(' + ${notif.application.referenceNumber} + ')'"></span>
                            </a>
                        </div>
                    </div>
                    <div th:if="${!notif.read}">
                        <form th:action="@{'/student/notifications/' + ${notif.id} + '/read'}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-secondary text-nowrap">Mark read</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
