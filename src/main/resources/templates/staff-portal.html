<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Docket | Staff Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/staff-portal.css}">
</head>

<body class="bg-light">

    <header class="portal-hero text-center">
        <div class="container">
            <span class="brand-pill mb-3">DOCKET · STAFF PORTAL</span>
            <h1 class="display-5 fw-bold mt-3">Welcome, colleague</h1>
            <p class="lead mb-0">Choose your role to sign in and manage your applications.</p>
        </div>
    </header>

    <main class="container portal-cards pb-5">

        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-4" th:each="r : ${officerRoles}">
                <!-- TODO: confirm login URL with Person 2 (assumed /login?role=...) -->
                <a class="role-card" th:classappend="${r.group()}" th:href="@{/login(role=${r.code()})}">
                    <div class="role-icon" th:text="${r.icon()}">🗂️</div>
                    <h5 class="fw-bold" th:text="${r.title()}">Role</h5>
                    <p class="text-secondary" th:text="${r.description()}">Description</p>
                    <span class="role-cta">Sign in &rarr;</span>
                </a>
            </div>
        </div>

        <h6 class="text-uppercase text-secondary mt-5 mb-3">System administration</h6>
        <div class="row">
            <div class="col-12 col-lg-6">
                <a class="role-card admin" th:href="@{/login(role=${adminRole.code()})}">
                    <div class="d-flex align-items-center gap-3">
                        <div class="role-icon mb-0" th:text="${adminRole.icon()}">⚙️</div>
                        <div>
                            <h5 class="fw-bold mb-1" th:text="${adminRole.title()}">Administrator</h5>
                            <p class="text-secondary mb-1" th:text="${adminRole.description()}">Description</p>
                            <span class="role-cta">Sign in &rarr;</span>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <div class="d-flex flex-wrap justify-content-between align-items-center mt-5 small text-secondary">
            <div>
                <span class="me-3"><span class="legend-dot" style="background:#198754"></span>Approval /
                    verification</span>
                <span class="me-3"><span class="legend-dot" style="background:#e8590c"></span>Finance / accounts</span>
                <span><span class="legend-dot" style="background:#6f42c1"></span>Administration</span>
            </div>
            <a th:href="@{/login}" class="text-decoration-none">Are you a student? Student login &rarr;</a>
        </div>
    </main>

</body>

</html>
