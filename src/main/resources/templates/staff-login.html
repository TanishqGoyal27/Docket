<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Docket | Staff Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/staff-portal.css}">
</head>

<body class="bg-light">

    <header class="portal-hero text-center" style="padding-bottom: 7rem;">
        <div class="container">
            <span class="brand-pill">DOCKET · STAFF PORTAL</span>
            <h1 class="h2 fw-bold mt-3">Staff Sign In</h1>
            <p class="mb-0">Signing in as <strong th:text="${roleTitle}">Staff</strong></p>
        </div>
    </header>

    <main class="container" style="margin-top: -4rem; max-width: 460px;">
        <div class="card shadow border-0" style="border-radius: 14px;">
            <div class="card-body p-4">

                <div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div>
                <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>

                <!-- TODO: confirm the login processing URL and field names with Person 2 -->
                <form th:action="@{/staff/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Email</label>
                        <input type="email" id="username" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sign in</button>
                </form>

                <div class="text-center mt-3 small">
                    <a th:href="@{/staff/portal}" class="text-decoration-none">&larr; Choose a different role</a>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
