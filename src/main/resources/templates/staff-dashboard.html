<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Docket | Staff Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/staff/dashboard}">Docket | Staff Portal</a>
            <!-- TODO: notification bell with unread count goes here -->
        </div>
    </nav>

    <main class="container py-4">
        <h1 class="h3">Staff Dashboard</h1>
        <p class="text-secondary">Manage applications assigned to your role.</p>

        <div class="card shadow-sm mt-4" style="max-width: 400px;">
            <div class="card-body">
                <p class="text-secondary mb-2">Pending Applications</p>
                <p class="display-5 fw-bold" th:text="${pendingCount}">3</p>
                <a th:href="@{/staff/queue}" class="btn btn-primary">View Pending Queue</a>
            </div>
        </div>

        <!-- TODO: replace sample count with WorkflowService data -->
    </main>

</body>

</html>
