<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pending Queue | Docket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/staff/dashboard}">Docket | Staff Portal</a>
            <!-- TODO: notification bell with unread count goes here -->
        </div>
    </nav>

    <div class="container py-5">

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1>Pending Queue</h1>
                <p class="text-secondary">Review applications assigned to your role.</p>
            </div>
            <a th:href="@{/staff/dashboard}" class="btn btn-outline-primary">Back to Dashboard</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">

                <input type="text" id="searchInput" class="form-control mb-4"
                    placeholder="Search by ID, student, service or status...">

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Application ID</th>
                                <th>Applicant</th>
                                <th>Service</th>
                                <th>Submitted On</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="applicationTable">
                            <tr th:each="app : ${applications}">
                                <td th:text="${app.id}">APP-001</td>
                                <td th:text="${app.student}">Student</td>
                                <td th:text="${app.type}">Service</td>
                                <td th:text="${app.date}">01 Jan 2026</td>
                                <td><span class="badge text-bg-warning" th:text="${app.status}">STATUS</span></td>
                                <td>
                                    <a th:href="@{/staff/review(id=${app.id})}"
                                        class="btn btn-sm btn-primary">Review</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <p id="noResults" class="text-secondary d-none">No matching applications found.</p>

            </div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById("searchInput");
        const rows = document.querySelectorAll("#applicationTable tr");
        const noResults = document.getElementById("noResults");

        searchInput.addEventListener("input", function () {
            const query = this.value.toLowerCase();
            let visibleCount = 0;

            rows.forEach(function (row) {
                const matches = row.textContent.toLowerCase().includes(query);
                row.style.display = matches ? "" : "none";
                if (matches) { visibleCount++; }
            });

            noResults.classList.toggle("d-none", visibleCount !== 0);
        });
    </script>

</body>

</html>
